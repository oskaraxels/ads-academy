<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="Diagram: Steering automation: four inputs you control" font-family="Atkinson Hyperlegible, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect width="880" height="440" rx="14" fill="#fbfcfe" stroke="#d5dbe3"/><rect x="14" y="12" width="84" height="22" rx="5" fill="#1b1f24"/><text x="56" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">DIAGRAM</text><text x="112" y="29" font-size="17" font-weight="700" fill="#1b1f24">Steering automation: four inputs you control</text><rect x="30" y="60" width="300" height="76" rx="10" fill="#fff7e0" stroke="#5f6b7a" stroke-width="2"/><text x="180.0" y="84.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">GOAL</text><text x="180.0" y="102.9" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">conversions + value,</text><text x="180.0" y="121.1" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">CPA / ROAS target</text><line x1="335" y1="98" x2="470" y2="225" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="148" width="300" height="76" rx="10" fill="#eef3ff" stroke="#5f6b7a" stroke-width="2"/><text x="180.0" y="172.70000000000002" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">MATERIAL</text><text x="180.0" y="190.9" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">creative, feeds,</text><text x="180.0" y="209.10000000000002" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">landing pages</text><line x1="335" y1="186" x2="470" y2="225" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="236" width="300" height="76" rx="10" fill="#f3edfb" stroke="#5f6b7a" stroke-width="2"/><text x="180.0" y="260.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">SIGNALS</text><text x="180.0" y="278.9" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">customer lists, audience</text><text x="180.0" y="297.09999999999997" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">signals, search themes</text><line x1="335" y1="274" x2="470" y2="225" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="324" width="300" height="76" rx="10" fill="#fdecea" stroke="#5f6b7a" stroke-width="2"/><text x="180.0" y="348.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">FENCES</text><text x="180.0" y="366.9" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">locations, ages, exclusions,</text><text x="180.0" y="385.09999999999997" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">negatives, policy</text><line x1="335" y1="362" x2="470" y2="225" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="475" y="150" width="370" height="150" rx="10" fill="#f2f4f7" stroke="#5f6b7a" stroke-width="2"/><text x="660.0" y="201.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">The system decides</text><text x="660.0" y="220.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">which auctions, which people,</text><text x="660.0" y="240.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">which placements, which</text><text x="660.0" y="259.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">combinations of your assets</text><text x="660" y="340" text-anchor="middle" font-size="13" font-weight="400" fill="#5f6b7a">You judge the output on total business results</text><text x="866" y="430" text-anchor="end" font-size="11" fill="#5f6b7a">Own diagram</text></svg>