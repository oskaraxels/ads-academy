<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="Diagram: Budget = how much fuel · Bid strategy = how to drive" font-family="Atkinson Hyperlegible, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect width="880" height="440" rx="14" fill="#fbfcfe" stroke="#d5dbe3"/><rect x="14" y="12" width="84" height="22" rx="5" fill="#1b1f24"/><text x="56" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">DIAGRAM</text><text x="112" y="29" font-size="17" font-weight="700" fill="#1b1f24">Budget = how much fuel · Bid strategy = how to drive</text><rect x="40" y="80" width="370" height="280" rx="10" fill="#fff7e0" stroke="#c99a06" stroke-width="2"/><text x="225.0" y="176.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">BUDGET</text><text x="225.0" y="196.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Daily or lifetime</text><text x="225.0" y="215.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Campaign level (Advantage+ campaign budget)</text><text x="225.0" y="235.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">or ad set level</text><text x="225.0" y="254.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Daily can flex: up to 175% a day,</text><text x="225.0" y="274.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">never over 7× a week</text><rect x="470" y="80" width="370" height="280" rx="10" fill="#eef3ff" stroke="#1f5fbf" stroke-width="2"/><text x="655.0" y="186.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">BID STRATEGY</text><text x="655.0" y="205.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Spend-based: Highest volume / value</text><text x="655.0" y="225.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Goal-based: Cost per result / ROAS goal</text><text x="655.0" y="244.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Manual: Bid cap</text><text x="655.0" y="264.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Start simple: Highest volume</text><text x="866" y="430" text-anchor="end" font-size="11" fill="#5f6b7a">Based on Meta Business Help Center: budgets; bid strategies</text></svg>