<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="Diagram: Match types: how close a search must be to your keyword" font-family="Atkinson Hyperlegible, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect width="880" height="440" rx="14" fill="#fbfcfe" stroke="#d5dbe3"/><rect x="14" y="12" width="84" height="22" rx="5" fill="#1b1f24"/><text x="56" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">DIAGRAM</text><text x="112" y="29" font-size="17" font-weight="700" fill="#1b1f24">Match types: how close a search must be to your keyword</text><rect x="30" y="70" width="820" height="330" rx="10" fill="#f4faf6" stroke="#188038" stroke-width="2"/><text x="440.0" y="94.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1b1f24">BROAD   bike repair   → related searches, e.g. &quot;fix my bicycle chain&quot; (use with Smart Bidding)</text><rect x="110" y="140" width="660" height="240" rx="10" fill="#e8f5ec" stroke="#188038" stroke-width="2"/><text x="440.0" y="164.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1b1f24">PHRASE   &quot;bike repair&quot;   → includes the meaning, e.g. &quot;bike repair near me&quot;</text><rect x="220" y="270" width="440" height="90" rx="10" fill="#cfe9d8" stroke="#188038" stroke-width="2"/><text x="440.0" y="310.79999999999995" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">EXACT   [bike repair]</text><text x="440.0" y="328.99999999999994" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">same meaning or intent, e.g. &quot;bicycle repair&quot;</text><text x="866" y="430" text-anchor="end" font-size="11" fill="#5f6b7a">Based on Google Ads Help: keyword matching options</text></svg>