<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="Diagram: The metric chain: from impression to profit" font-family="Atkinson Hyperlegible, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect width="880" height="440" rx="14" fill="#fbfcfe" stroke="#d5dbe3"/><rect x="14" y="12" width="84" height="22" rx="5" fill="#1b1f24"/><text x="56" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">DIAGRAM</text><text x="112" y="29" font-size="17" font-weight="700" fill="#1b1f24">The metric chain: from impression to profit</text><rect x="30" y="120" width="180" height="120" rx="10" fill="#eef3ff" stroke="#5f6b7a" stroke-width="2"/><text x="120.0" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Impressions</text><text x="120.0" y="195.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">CPM</text><line x1="215" y1="180" x2="240" y2="180" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="245" y="120" width="180" height="120" rx="10" fill="#f3edfb" stroke="#5f6b7a" stroke-width="2"/><text x="335.0" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Clicks</text><text x="335.0" y="195.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">CTR · CPC</text><line x1="430" y1="180" x2="455" y2="180" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="460" y="120" width="180" height="120" rx="10" fill="#e8f5ec" stroke="#5f6b7a" stroke-width="2"/><text x="550.0" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Conversions</text><text x="550.0" y="195.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">CVR · CPA</text><line x1="645" y1="180" x2="670" y2="180" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="675" y="120" width="180" height="120" rx="10" fill="#fff7e0" stroke="#5f6b7a" stroke-width="2"/><text x="765.0" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Revenue</text><text x="765.0" y="195.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">ROAS</text><text x="440" y="290" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">CPM = spend ÷ impressions × 1,000   ·   CTR = clicks ÷ impressions   ·   CPC = spend ÷ clicks</text><text x="440" y="318" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">CVR = conversions ÷ clicks   ·   CPA = spend ÷ conversions   ·   ROAS = revenue ÷ spend</text><text x="440" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#b3261e">When results drop, find the FIRST link that moved.</text><text x="866" y="430" text-anchor="end" font-size="11" fill="#5f6b7a">Own diagram</text></svg>