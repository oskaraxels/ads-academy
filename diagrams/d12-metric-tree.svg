<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="Diagram: The metric tree: split CPA into its parts" font-family="Atkinson Hyperlegible, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect width="880" height="440" rx="14" fill="#fbfcfe" stroke="#d5dbe3"/><rect x="14" y="12" width="84" height="22" rx="5" fill="#1b1f24"/><text x="56" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">DIAGRAM</text><text x="112" y="29" font-size="17" font-weight="700" fill="#1b1f24">The metric tree: split CPA into its parts</text><rect x="340" y="60" width="200" height="70" rx="10" fill="#b3261e" stroke="#b3261e" stroke-width="2"/><text x="440.0" y="90.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">CPA</text><text x="440.0" y="110.0" text-anchor="middle" font-size="13" font-weight="400" fill="#fff">cost per result</text><line x1="440" y1="135" x2="170" y2="195" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="60" y="200" width="220" height="90" rx="10" fill="#fff" stroke="#5f6b7a" stroke-width="2"/><text x="170.0" y="240.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">CPM ÷ 1,000</text><text x="170.0" y="260.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">cost of attention</text><text x="170" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#5f6b7a">→ Market / auction</text><line x1="440" y1="135" x2="440" y2="195" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="330" y="200" width="220" height="90" rx="10" fill="#fff" stroke="#5f6b7a" stroke-width="2"/><text x="440.0" y="240.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">÷ CTR</text><text x="440.0" y="260.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">did they click?</text><text x="440" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#5f6b7a">→ Creative</text><line x1="440" y1="135" x2="710" y2="195" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="200" width="220" height="90" rx="10" fill="#fff" stroke="#5f6b7a" stroke-width="2"/><text x="710.0" y="240.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">÷ CVR</text><text x="710.0" y="260.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">did they convert?</text><text x="710" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#5f6b7a">→ Landing page / offer</text><text x="440" y="375" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">ROAS adds a fourth branch: average order value.  First rule out tracking and the calendar.</text><text x="866" y="430" text-anchor="end" font-size="11" fill="#5f6b7a">Own diagram</text></svg>