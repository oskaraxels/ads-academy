<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="Diagram: Meta&#x27;s auction: the highest total value wins" font-family="Atkinson Hyperlegible, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect width="880" height="440" rx="14" fill="#fbfcfe" stroke="#d5dbe3"/><rect x="14" y="12" width="84" height="22" rx="5" fill="#1b1f24"/><text x="56" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">DIAGRAM</text><text x="112" y="29" font-size="17" font-weight="700" fill="#1b1f24">Meta&#x27;s auction: the highest total value wins</text><rect x="30" y="110" width="190" height="110" rx="10" fill="#eef3ff" stroke="#1f5fbf" stroke-width="2"/><text x="125.0" y="141.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Bid</text><text x="125.0" y="160.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">what you&#x27;re willing</text><text x="125.0" y="180.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">to pay (or the system</text><text x="125.0" y="199.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">bids for you)</text><text x="245" y="172" text-anchor="middle" font-size="34" font-weight="700" fill="#1b1f24">+</text><rect x="270" y="110" width="220" height="110" rx="10" fill="#eef3ff" stroke="#1f5fbf" stroke-width="2"/><text x="380.0" y="150.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Estimated action rate</text><text x="380.0" y="170.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">how likely this person</text><text x="380.0" y="189.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">is to take your action</text><text x="515" y="172" text-anchor="middle" font-size="34" font-weight="700" fill="#1b1f24">+</text><rect x="540" y="110" width="170" height="110" rx="10" fill="#eef3ff" stroke="#1f5fbf" stroke-width="2"/><text x="625.0" y="150.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Ad quality</text><text x="625.0" y="170.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">feedback and</text><text x="625.0" y="189.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">low-quality signals</text><line x1="725" y1="165" x2="760" y2="165" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="765" y="110" width="95" height="110" rx="10" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="2"/><text x="812.5" y="160.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Total</text><text x="812.5" y="180.0" text-anchor="middle" font-size="13" font-weight="400" fill="#fff">value</text><rect x="270" y="270" width="440" height="80" rx="10" fill="#fff7e0" stroke="#c99a06" stroke-width="2"/><text x="490.0" y="305.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Relevance = estimated action rate + ad quality</text><text x="490.0" y="325.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">A more relevant ad can beat a higher bid</text><text x="866" y="430" text-anchor="end" font-size="11" fill="#5f6b7a">Based on Meta Business Help Center: About ad auctions</text></svg>