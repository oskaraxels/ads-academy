eight="400" fill="#1b1f24">1 order</text><text x="440" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#b3261e">Platform totals can add up to more than real sales. Report the business numbers first.</text><text x="866" y="430" text-anchor="end" font-size="11" fill="#5f6b7a">Own diagram</text></svg>