<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="Diagram: Responsive search ad: a box of parts Google combines" font-family="Atkinson Hyperlegible, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect width="880" height="440" rx="14" fill="#fbfcfe" stroke="#d5dbe3"/><rect x="14" y="12" width="84" height="22" rx="5" fill="#1b1f24"/><text x="56" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">DIAGRAM</text><text x="112" y="29" font-size="17" font-weight="700" fill="#1b1f24">Responsive search ad: a box of parts Google combines</text><rect x="30" y="60" width="330" height="350" rx="10" fill="#e8f5ec" stroke="#188038" stroke-width="2"/><text x="195.0" y="185.3" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">You provide</text><text x="195.0" y="203.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">3–15 headlines (≤30 characters)</text><text x="195.0" y="221.70000000000002" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">2–4 descriptions (≤90)</text><text x="195.0" y="239.9" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">2 display paths (≤15)</text><text x="195.0" y="258.1" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">final URL</text><text x="195.0" y="276.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">each headline must work alone</text><text x="195.0" y="294.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">pin only what must always show</text><line x1="370" y1="235" x2="450" y2="235" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#ah)"/><text x="410.0" y="227.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5f6b7a">Google mixes</text><rect x="460" y="110" width="390" height="250" rx="10" fill="#fff" stroke="#5f6b7a" stroke-width="2"/><text x="655.0" y="194.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">What a searcher sees</text><text x="655.0" y="212.6" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">Sponsored · bikeshop.se/service</text><text x="655.0" y="230.8" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">Bike Service in Stockholm | Ready</text><text x="655.0" y="249.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">Same Day | Book Online in 2 Minutes</text><text x="655.0" y="267.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">Fixed-price service. Mechanics with</text><text x="655.0" y="285.4" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">10 years&#x27; experience. Book a time today.</text><text x="655" y="390" text-anchor="middle" font-size="13" font-weight="400" fill="#5f6b7a">up to 3 headlines + descriptions, in any order</text><text x="866" y="430" text-anchor="end" font-size="11" fill="#5f6b7a">Based on Google Ads Help: About responsive search ads</text></svg>