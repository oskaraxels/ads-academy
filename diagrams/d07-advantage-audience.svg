<rect width="880" height="440" rx="14" fill="#fbfcfe" stroke="#d5dbe3"/><rect x="14" y="12" width="84" height="22" rx="5" fill="#1b1f24"/><text x="56" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">DIAGRAM</text><text x="112" y="29" font-size="17" font-weight="700" fill="#1b1f24">Advantage+ audience: the fence is fixed, suggestions are a start</text><rect x="30" y="60" width="820" height="350" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="440.0" y="240.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24"></text><text x="50" y="90" text-anchor="start" font-size="14" font-weight="700" fill="#b3261e">HARD CONTROLS (the fence): location · minimum age · language · excluded custom audiences</text><rect x="120" y="130" width="640" height="250" rx="10" fill="#eef3ff" stroke="#1f5fbf" stroke-width="2"/><text x="440.0" y="260.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24"></text><rect x="300" y="190" width="280" height="120" rx="10" fill="#fff7e0" stroke="#c99a06" stroke-width="2"/><text x="440.0" y="236.70000000000002" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">Your suggestions</text><text x="440.0" y="254.9" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">age range, gender,</text><text x="440.0" y="273.1" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">interests, custom audiences</text><text x="440" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1f5fbf">Meta starts with your suggestions, but may go beyond them inside the fence</text><text x="866" y="430" text-anchor="end" font-size="11" fill="#5f6b7a">Based on Meta for Developers: Advantage+ audience</text></svg>