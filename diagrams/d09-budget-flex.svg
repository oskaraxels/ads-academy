<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="Diagram: Daily budgets are averages with caps" font-family="Atkinson Hyperlegible, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect width="880" height="440" rx="14" fill="#fbfcfe" stroke="#d5dbe3"/><rect x="14" y="12" width="84" height="22" rx="5" fill="#1b1f24"/><text x="56" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">DIAGRAM</text><text x="112" y="29" font-size="17" font-weight="700" fill="#1b1f24">Daily budgets are averages with caps</text><rect x="30" y="70" width="400" height="320" rx="10" fill="#eef3ff" stroke="#1f5fbf" stroke-width="2"/><text x="230.0" y="196.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">META (daily budget 100)</text><text x="230.0" y="215.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Any day: up to 175</text><text x="230.0" y="235.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">(up to 75% over)</text><text x="230.0" y="254.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Calendar week: max 700 (7×)</text><text x="230.0" y="274.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Budget sharing: +20% per ad set</text><rect x="450" y="70" width="400" height="320" rx="10" fill="#e8f5ec" stroke="#188038" stroke-width="2"/><text x="650.0" y="196.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">GOOGLE (average daily 100)</text><text x="650.0" y="215.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Any day: up to 200 (2×)</text><text x="650.0" y="235.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">Month: max 3,040 (30.4×)</text><text x="650.0" y="254.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">You never pay more than</text><text x="650.0" y="274.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">the monthly limit</text><text x="866" y="430" text-anchor="end" font-size="11" fill="#5f6b7a">Based on Meta Business Help Center: daily budgets · Google Ads Help: overdelivery</text></svg>